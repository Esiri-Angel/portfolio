<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Null Circuit</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#080913;color:#ecfbff;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}
main{width:min(96vw,1050px)} header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font:700 12px ui-monospace,monospace;letter-spacing:.21em;color:#a7b5d5}
.stage{position:relative;border:1px solid #344166;border-radius:16px;overflow:hidden;background:#101327;box-shadow:0 25px 100px #4c247342;outline:none}
canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none} .menu{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#080913a8;padding:18px}
.menu[hidden]{display:none} h1{font-size:clamp(32px,8vw,100px);line-height:.9;margin:0;letter-spacing:-.095em;text-transform:uppercase;text-shadow:4px 4px #623aff;color:#f6f9ff}
p{margin:14px 0 20px;color:#d0dcfa} button{justify-self:center;background:#6cfce0;color:#071820;border:0;padding:13px 27px;border-radius:5px;font:800 14px system-ui;cursor:pointer} button:focus-visible{outline:3px solid white;outline-offset:4px}
footer{padding:13px 0;color:#a7b5d5;text-align:center;font-size:13px} kbd{font:inherit;color:#eff4ff} #practice{margin-top:8px;background:#242d48;color:#e6f2ff} #sound{background:none;color:#a7b5d5;padding:3px 0;letter-spacing:inherit;font:inherit}
</style>
<main>
<header><span>NULL CIRCUIT</span><button id="sound" type="button" aria-pressed="true">SOUND ON</button></header>
<div class="stage" tabindex="0" aria-label="Null Circuit game arena">
<canvas width="960" height="540"></canvas>
<div class="menu"><h1>Null Circuit</h1><p>Dash through enemy fire to send it back.</p><button id="start" type="button">Enter arena</button><button id="practice" type="button">Practice round</button></div>
</div>
<footer><kbd>WASD</kbd> / <kbd>↑ ↓ ← →</kbd> Move &nbsp;·&nbsp; <kbd>Space</kbd> Dash &nbsp;·&nbsp; <kbd>Esc</kbd> Pause<br>Touch: drag to move, tap to dash</footer>
</main>
<script>
const canvas=document.querySelector('canvas'), g=canvas.getContext('2d'), stage=document.querySelector('.stage');
const menu=document.querySelector('.menu'), start=document.querySelector('#start'), title=menu.querySelector('h1'), desc=menu.querySelector('p'), sound=document.querySelector('#sound');
const practiceButton=document.querySelector('#practice');
const W=960,H=540, START_LIVES=5, MAX_LIVES=99, keys=new Set();
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const near=(a,b,r)=>(a.x-b.x)**2+(a.y-b.y)**2<r*r;
const aim=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
let paletteIndex=0, practicing=false;
let state='intro', player={x:480,y:270}, shots=[], enemies=[], dust=[], wave=0, score=0, clock=0, nextWave=0, combo=0, shake=0, flash=0, muted=false, audio, pointer=null, touchOrigin=null, last=0;
function beep(hz,type='sine',len=.13,volume=.09,end=hz/2){
 if(muted||!audio)return;
 const now=audio.currentTime, osc=audio.createOscillator(), gain=audio.createGain();
 osc.type=type; osc.frequency.setValueAtTime(hz,now); osc.frequency.exponentialRampToValueAtTime(end,now+len);
 gain.gain.setValueAtTime(volume,now); gain.gain.exponentialRampToValueAtTime(.001,now+len);
 osc.connect(gain).connect(audio.destination); osc.start();osc.stop(now+len);
}
function burst(x,y,color,n=12){
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=60+Math.random()*240;dust.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:.25+Math.random()*.4});}
}
function begin(practice=false){
 audio ||= new AudioContext(); audio.resume();
 if(state!=='paused'){
  practicing=practice;
  player={x:480,y:270,hp:START_LIVES,dx:1,dy:0,dash:0,cool:0,inv:0};
  shots=[];enemies=[];dust=[];wave=0;score=0;combo=0;clock=0;nextWave=.65;shake=0;flash=0;paletteIndex=0;
 }
 state='playing';menu.hidden=true;stage.focus();
}
function show(mode){
 state=mode;keys.clear();pointer=null;touchOrigin=null;menu.hidden=false;
 practiceButton.hidden=mode==='paused';
 title.textContent=mode==='paused'?'Paused':mode==='practice-complete'?'Practice cleared':'Circuit Broken';
 desc.textContent=mode==='paused'?'Ready when you are.':mode==='practice-complete'?'Ready for a scored run?':`Score ${score.toLocaleString()} · Wave ${wave}`;
 start.textContent=mode==='paused'?'Resume':mode==='practice-complete'?'Start run':'One more run';
 practiceButton.textContent='Practice again';start.focus();
}
function dash(){
 if(state!=='playing'||player.cool>0)return;
 player.dash=.19;player.cool=.87;shake=4;burst(player.x,player.y,'#68fce2',14);beep(190,'sawtooth',.23,.055,65);
}
function spawn(){
 wave++; nextWave=0; flash=.27;beep(196,'triangle',.32,.09,392);
 const count=practicing?2:Math.min(3+wave,12);
 for(let i=0;i<count;i++){
  const a=i/count*Math.PI*2+wave*.64;
  const elite=wave%4===0&&i===0;
  enemies.push({x:480+Math.cos(a)*375,y:270+Math.sin(a)*190,wake:.65+i*.06,fire:.95+i*.22,hp:elite?4:1,elite,angle:a});
 }
}
function hurt(){
 if(player.inv>0||player.dash>0)return;
 if(!practicing)player.hp--;
 player.inv=1.05;combo=0;shake=13;flash=.3;burst(player.x,player.y,'#ff557f',26);beep(95,'square',.3,.085,46);
 if(player.hp<=0)show('lost');
}
function reflect(b){
 const target=enemies.filter(e=>e.wake<=0).reduce((best,e)=>!best||near(b,e,Math.hypot(best.x-b.x,best.y-b.y))?e:best,null);
 const a=target?aim(b,target):Math.atan2(-b.vy,-b.vx);
 b.vx=Math.cos(a)*720;b.vy=Math.sin(a)*720;b.friendly=true;
 score+=25;combo++;shake=7;burst(b.x,b.y,'#7bffe7',15);beep(350+Math.min(combo,12)*36,'triangle',.18,.13,170);
}
function update(dt){
 clock+=dt;
 if(!enemies.length){
  if(nextWave===0)nextWave=clock+1.1;
  if(clock>=nextWave)spawn();
 }
 let x=+(keys.has('d')||keys.has('ArrowRight'))-+(keys.has('a')||keys.has('ArrowLeft'));
 let y=+(keys.has('s')||keys.has('ArrowDown'))-+(keys.has('w')||keys.has('ArrowUp'));
 if(pointer){x=(pointer.x-player.x)/22;y=(pointer.y-player.y)/22;}
 const n=Math.hypot(x,y);
 if(n>.15&&player.dash<=0){player.dx=x/n;player.dy=y/n;}
 const speed=player.dash>0?1050:n>.15?250:0;
 player.x=clamp(player.x+player.dx*speed*dt,26,W-26);player.y=clamp(player.y+player.dy*speed*dt,38,H-26);
 if(player.dash>0)burst(player.x,player.y,'#43d8ca',2);
 for(const timer of ['dash','cool','inv'])player[timer]=Math.max(0,player[timer]-dt);
 for(const e of enemies){
  e.wake-=dt;if(e.wake>0)continue;
  const a=aim(e,player),dist=Math.hypot(e.x-player.x,e.y-player.y);
  e.angle=a;
  if(dist>125){const v=e.elite?37:47+Math.min(36,wave*3);e.x+=Math.cos(a)*v*dt;e.y+=Math.sin(a)*v*dt;}
  e.fire-=dt;
  if(e.fire<=0){
   e.fire=Math.max(.65,1.6-wave*.066);
   for(const offset of e.elite?[-.29,0,.29]:[0]){
    const v=practicing?130:177+Math.min(135,wave*12);
    shots.push({x:e.x,y:e.y,vx:Math.cos(a+offset)*v,vy:Math.sin(a+offset)*v,friendly:false});
   }
  }
  if(near(e,player,25)){
   if(player.dash>0){e.hp=0;score+=90;shake=7;burst(e.x,e.y,'#f994ff',18);beep(120,'triangle',.15);}
   else hurt();
  }
 }
 for(const b of shots){
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(!b.friendly&&near(b,player,player.dash>0?39:15)){
   if(player.dash>0)reflect(b);else{hurt();b.dead=true;}
  }
  if(b.friendly){
   const e=enemies.find(e=>e.hp>0&&e.wake<=0&&near(e,b,e.elite?24:17));
   if(e){e.hp--;b.dead=true;score+=e.hp?40:100+Math.min(combo,15)*15;burst(e.x,e.y,'#ff87e5',e.hp?8:22);shake=7;beep(105,'triangle',.16,.12,48);}
  }
 }
 shots=shots.filter(b=>!b.dead&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 if(enemies.some(e=>e.elite&&e.hp<=0)){
  paletteIndex=(paletteIndex+1)%backdrops.length;flash=.5;
 }
 const hadEnemies=enemies.length>0;
 enemies=enemies.filter(e=>e.hp>0);
 if(state==='playing'&&hadEnemies&&!enemies.length){
  if(practicing)show('practice-complete');
  else player.hp=Math.min(MAX_LIVES,player.hp+1);
 }
 for(const p of dust){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
 dust=dust.filter(p=>p.life>0).slice(-600);shake*=Math.pow(.016,dt);flash=Math.max(0,flash-dt);
}
const backdrops=[['#24234a','#0a0d20'],['#145052','#061b28'],['#583242','#220e20'],['#4b431a','#161507']].map(([center,edge])=>{
const backdrop=document.createElement('canvas');backdrop.width=W;backdrop.height=H;
const bg=backdrop.getContext('2d'), grad=bg.createRadialGradient(490,220,20,490,220,560);
grad.addColorStop(0,center);grad.addColorStop(1,edge);bg.fillStyle=grad;bg.fillRect(0,0,W,H);
bg.strokeStyle='#95a4ff1a';bg.lineWidth=1;bg.beginPath();
for(let i=0;i<=W;i+=36){bg.moveTo(i,0);bg.lineTo(i,H);}
for(let i=0;i<=H;i+=36){bg.moveTo(0,i);bg.lineTo(W,i);}bg.stroke();
bg.strokeStyle='#7181be40';bg.strokeRect(15,15,W-30,H-30);
return backdrop;
});
function circle(x,y,r,color){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill();}
function ship(x,y,a,r,color){
 g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.moveTo(r,0);g.lineTo(-r*.78,r*.68);g.lineTo(-r*.43,0);g.lineTo(-r*.78,-r*.68);g.closePath();g.fillStyle=color;g.fill();g.restore();
}
function draw(t){
 g.drawImage(backdrops[paletteIndex],0,0);g.save();g.translate(Math.sin(t*104)*shake,Math.cos(t*94)*shake);
 for(const p of dust){g.globalAlpha=clamp(p.life*2.5,0,1);circle(p.x,p.y,2.1,p.color);}g.globalAlpha=1;
 for(const e of enemies){
  if(e.wake>0){g.strokeStyle='#ff65a5';g.beginPath();g.arc(e.x,e.y,9+e.wake*23,0,Math.PI*2);g.stroke();continue;}
  const r=e.elite?28:17;
  g.shadowBlur=17;g.shadowColor='#fa477e';ship(e.x,e.y,e.angle,r,e.elite?'#ffcf6c':'#ff628e');g.shadowBlur=0;
 }
 for(const b of shots){const c=b.friendly?'#66ffe4':'#ff6f98';g.strokeStyle=c;g.lineWidth=b.friendly?4:2;g.beginPath();g.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);g.lineTo(b.x,b.y);g.stroke();circle(b.x,b.y,b.friendly?5:4,c);}
 if(player.inv===undefined||player.inv===0||Math.floor(t*19)%2===0){
  if(player.dash>0){g.strokeStyle='#7dffdc';g.lineWidth=2;g.beginPath();g.arc(player.x,player.y,29+Math.sin(t*45)*5,0,Math.PI*2);g.stroke();}
  g.shadowColor='#76ffea';g.shadowBlur=17;ship(player.x,player.y,Math.atan2(player.dy||0,player.dx||1),18,'#a6ffeb');g.shadowBlur=0;
 }
 g.restore();
 if(flash){g.fillStyle=`rgba(201,143,255,${flash*.19})`;g.fillRect(0,0,W,H);}
 g.font='700 19px monospace';g.fillStyle='#e6eeff';g.fillText(practicing?'PRACTICE':`WAVE ${String(wave).padStart(2,'0')}`,35,48);
 g.textAlign='right';g.fillText(practicing?'UNSCORED':score.toLocaleString(),924,48);g.textAlign='left';
 g.font='700 13px monospace';g.fillStyle='#aab8de';g.fillText('DASH',35,H-31);
 g.fillStyle='#303853';g.fillRect(84,H-39,113,7);g.fillStyle='#73fce1';g.fillRect(84,H-39,113*(1-(player.cool||0)/.87),7);
 g.textAlign='right';g.fillStyle='#ff8dac';g.fillText(practicing?'NO LIFE LOSS':`LIVES  ${player.hp??START_LIVES} / ${MAX_LIVES}`,925,H-31);g.textAlign='left';
 if(combo>1){g.textAlign='center';g.font='700 17px monospace';g.fillStyle='#8cffdf';g.fillText(`REFLECT ×${combo}`,W/2,49);g.textAlign='left';}
}
function frame(ms){const t=ms/1000,dt=last?Math.min(.034,t-last):0;last=t;if(state==='playing')update(dt);draw(t);requestAnimationFrame(frame);}
function keyName(e){return e.key.length===1?e.key.toLowerCase():e.key;}
window.addEventListener('keydown',e=>{const key=keyName(e);
 if(state==='playing'&&[' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key))e.preventDefault();
 if(key==='Escape'&&!e.repeat){if(state==='playing')show('paused');else if(state==='paused')begin();}
 if(state==='playing'){keys.add(key);if(key===' '&&!e.repeat)dash();}
});
window.addEventListener('keyup',e=>keys.delete(keyName(e)));
window.addEventListener('blur',()=>{if(state==='playing')show('paused');});
function locationOnCanvas(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)*W/rect.width,y:(e.clientY-rect.top)*H/rect.height};}
canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;canvas.setPointerCapture(e.pointerId);touchOrigin={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointermove',e=>{if(touchOrigin&&(pointer||Math.hypot(e.clientX-touchOrigin.x,e.clientY-touchOrigin.y)>8))pointer=locationOnCanvas(e);});
canvas.addEventListener('pointerup',()=>{if(touchOrigin&&!pointer)dash();pointer=null;touchOrigin=null;});
canvas.addEventListener('pointercancel',()=>{pointer=null;touchOrigin=null;});
sound.addEventListener('click',()=>{muted=!muted;sound.textContent=muted?'SOUND OFF':'SOUND ON';sound.setAttribute('aria-pressed',String(!muted));if(state==='playing')stage.focus();});
start.addEventListener('click',()=>begin());practiceButton.addEventListener('click',()=>begin(true));requestAnimationFrame(frame);
</script>
</html>
